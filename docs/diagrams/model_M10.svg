<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 928" width="900" height="928">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="900" height="928" fill="#ffffff"/><text x="40" y="30" class="h">M10: M9 trained with entropy coefficient 0.05 -&gt; 0.01. ne5qv1d2 (same result as M9)</text><rect x="40" y="44" width="16" height="16" rx="3" class="new"/><text x="62" y="56" class="s">added in this model</text><rect x="230" y="44" width="16" height="16" rx="3" class="base"/><text x="252" y="56" class="s">carried over</text><rect x="420" y="44" width="16" height="16" rx="3" class="side"/><text x="442" y="56" class="s">side input</text><rect x="40" y="80" width="520" height="58" rx="9" class="io"/><text x="300.0" y="106.5" text-anchor="middle" class="t">Per-job input (B x 10 x 20)</text><text x="300.0" y="123.5" text-anchor="middle" class="s">status (16-d) + size, wait, ttl, arrival (no usage)</text><path d="M300.0 138 L300.0 164" class="arr"/><rect x="40" y="164" width="520" height="58" rx="9" class="base"/><text x="300.0" y="190.5" text-anchor="middle" class="t">Job encoder</text><text x="300.0" y="207.5" text-anchor="middle" class="s">20 -&gt; 256 -&gt; 256 (Linear + LayerNorm + ReLU, twice), shared across jobs</text><path d="M300.0 222 L300.0 248" class="arr"/><rect x="40" y="248" width="520" height="58" rx="9" class="base"/><text x="300.0" y="274.5" text-anchor="middle" class="t">Fit attention with feasibility mask</text><text x="300.0" y="291.5" text-anchor="middle" class="s">weight = 0 where usage &gt; room</text><rect x="600" y="248" width="290" height="58" rx="9" class="side"/><text x="745.0" y="267.0" text-anchor="middle" class="t">Side input</text><text x="745.0" y="284.0" text-anchor="middle" class="s">job usage = max(usage)/255 | machine room =</text><text x="745.0" y="299.0" text-anchor="middle" class="s">min(capacity - usage)/255</text><path d="M600 277.0 L560 277.0" class="sarr"/><path d="M300.0 306 L300.0 332" class="arr"/><rect x="40" y="332" width="520" height="58" rx="9" class="base"/><text x="300.0" y="358.5" text-anchor="middle" class="t">Concat + project</text><text x="300.0" y="375.5" text-anchor="middle" class="s">[summary 256 | fit 64] -&gt; 256</text><path d="M300.0 390 L300.0 416" class="arr"/><rect x="40" y="416" width="520" height="58" rx="9" class="base"/><text x="300.0" y="442.5" text-anchor="middle" class="t">Job self-attention (4 heads)</text><text x="300.0" y="459.5" text-anchor="middle" class="s">finished jobs masked; residual + LayerNorm</text><path d="M300.0 474 L300.0 500" class="arr"/><rect x="40" y="500" width="520" height="74" rx="9" class="base"/><text x="300.0" y="527.0" text-anchor="middle" class="t">Attention pooling</text><text x="300.0" y="544.0" text-anchor="middle" class="s">score each job (256 -&gt; 32 -&gt; 1, tanh), weighted sum, Linear -&gt; global summary</text><text x="300.0" y="559.0" text-anchor="middle" class="s">256</text><path d="M300.0 574 L300.0 600" class="arr"/><rect x="40" y="600" width="520" height="74" rx="9" class="base"/><text x="300.0" y="627.0" text-anchor="middle" class="t">Scorer, once per job</text><text x="300.0" y="644.0" text-anchor="middle" class="s">[global | machine embedding | job] 768 -&gt; 128 -&gt; 128 -&gt; 1; skip head 256 -&gt; 64</text><text x="300.0" y="659.0" text-anchor="middle" class="s">-&gt; 1</text><path d="M300.0 674 L300.0 700" class="arr"/><rect x="40" y="700" width="520" height="58" rx="9" class="new"/><text x="300.0" y="726.5" text-anchor="middle" class="t">Training change</text><text x="300.0" y="743.5" text-anchor="middle" class="s">entropy coefficient annealed 0.05 -&gt; 0.01 (M9 used 0.02 -&gt; 0.002)</text><path d="M300.0 758 L300.0 784" class="arr"/><rect x="40" y="784" width="520" height="58" rx="9" class="io"/><text x="300.0" y="810.5" text-anchor="middle" class="t">11 action logits</text><text x="300.0" y="827.5" text-anchor="middle" class="s">[skip, job 1 ... job 10] -&gt; softmax -&gt; action</text><text x="40" y="872" class="s">Critic (value) head, all models: global summary 256 -> 256 -> 256 -> 1.</text><text x="40" y="890" class="s">PPO: lr 7e-6, 2048 steps, batch 64, 5 epochs, gamma = lambda = 0.995, 2M steps.</text></svg>