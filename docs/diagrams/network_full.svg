<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1818" width="1100" height="1818">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="1100" height="1818" fill="#ffffff"/><text x="40" y="30" class="h">The current network: from the observation to the action and the value</text><rect x="40" y="44" width="16" height="16" rx="3" class="new"/><text x="62" y="56" class="s">added in this model</text><rect x="230" y="44" width="16" height="16" rx="3" class="base"/><text x="252" y="56" class="s">carried over</text><rect x="420" y="44" width="16" height="16" rx="3" class="side"/><text x="442" y="56" class="s">side input</text><rect x="40" y="70" width="1020" height="56" rx="9" class="io"/><text x="550.0" y="95.5" text-anchor="middle" class="t">Observation</text><text x="550.0" y="112.5" text-anchor="middle" class="s">Output: machine usage and capacity B×1×3×10; job usage B×10×3×10; status, size, ttl, arrival, wait, start and finish times B×10; time B×1</text><rect x="40" y="196" width="470" height="88" rx="9" class="base"/><text x="275.0" y="222.5" text-anchor="middle" class="t">Per-job features</text><text x="275.0" y="239.5" text-anchor="middle" class="s">In: status B×10, size, wait, ttl, arrival B×10 each</text><text x="275.0" y="254.5" text-anchor="middle" class="s">Out: B×10×20</text><text x="275.0" y="269.5" text-anchor="middle" class="s">status embedding (16 learned numbers) + the 4 scaled numbers</text><rect x="40" y="310" width="470" height="88" rx="9" class="base"/><text x="275.0" y="336.5" text-anchor="middle" class="t">Job encoder</text><text x="275.0" y="353.5" text-anchor="middle" class="s">In: B×10×20</text><text x="275.0" y="368.5" text-anchor="middle" class="s">Out: B×10×256</text><text x="275.0" y="383.5" text-anchor="middle" class="s">Linear 20→256, LayerNorm, ReLU, twice; the same weights for every job</text><rect x="40" y="424" width="470" height="168" rx="9" class="new"/><text x="275.0" y="453.0" text-anchor="middle" class="t">Fit attention + feasibility mask</text><text x="275.0" y="470.0" text-anchor="middle" class="s">In: job usage B×10×3, machine room B×1×3</text><text x="275.0" y="485.0" text-anchor="middle" class="s">Out: fit vector B×10×64</text><text x="275.0" y="500.0" text-anchor="middle" class="s">Query = what the job needs (its usage, 3 numbers → 64)</text><text x="275.0" y="515.0" text-anchor="middle" class="s">Key = what the machine has free (its room, 3 numbers → 64)</text><text x="275.0" y="530.0" text-anchor="middle" class="s">Value = the machine information that gets passed on (its room, 3</text><text x="275.0" y="545.0" text-anchor="middle" class="s">numbers → 64)</text><text x="275.0" y="560.0" text-anchor="middle" class="s">weight = sigmoid(Query · Key ÷ 8), set to 0 unless the job fits on</text><text x="275.0" y="575.0" text-anchor="middle" class="s">every resource; output = weight × Value</text><rect x="40" y="618" width="470" height="88" rx="9" class="base"/><text x="275.0" y="644.5" text-anchor="middle" class="t">Concat + project</text><text x="275.0" y="661.5" text-anchor="middle" class="s">In: job summary B×10×256 + fit vector B×10×64</text><text x="275.0" y="676.5" text-anchor="middle" class="s">Out: B×10×256</text><text x="275.0" y="691.5" text-anchor="middle" class="s">concatenate (320), Linear 320→256, LayerNorm, ReLU</text><rect x="40" y="732" width="470" height="152" rx="9" class="base"/><text x="275.0" y="760.5" text-anchor="middle" class="t">Job self-attention (4 heads)</text><text x="275.0" y="777.5" text-anchor="middle" class="s">In: B×10×256 (finished jobs masked out as keys)</text><text x="275.0" y="792.5" text-anchor="middle" class="s">Out: B×10×256</text><text x="275.0" y="807.5" text-anchor="middle" class="s">Query = what this job looks for in the other jobs</text><text x="275.0" y="822.5" text-anchor="middle" class="s">Key = what each job offers to be compared on</text><text x="275.0" y="837.5" text-anchor="middle" class="s">Value = the information a job passes on when another job attends to it</text><text x="275.0" y="852.5" text-anchor="middle" class="s">all three are linear projections of the same job summaries (4 heads of</text><text x="275.0" y="867.5" text-anchor="middle" class="s">64); then residual + LayerNorm</text><rect x="40" y="910" width="470" height="120" rx="9" class="base"/><text x="275.0" y="937.5" text-anchor="middle" class="t">Attention pooling</text><text x="275.0" y="954.5" text-anchor="middle" class="s">In: B×10×256</text><text x="275.0" y="969.5" text-anchor="middle" class="s">Out: global summary B×256</text><text x="275.0" y="984.5" text-anchor="middle" class="s">no query, key or value: a small network (256→32→1) scores how much each</text><text x="275.0" y="999.5" text-anchor="middle" class="s">job matters, a softmax over the jobs gives weights, the summary is the</text><text x="275.0" y="1014.5" text-anchor="middle" class="s">weighted sum, then Linear 256→256</text><path d="M275.0 126 L275.0 196" class="arr"/><path d="M275.0 284 L275.0 310" class="arr"/><path d="M275.0 398 L275.0 424" class="arr"/><path d="M275.0 592 L275.0 618" class="arr"/><path d="M275.0 706 L275.0 732" class="arr"/><path d="M275.0 884 L275.0 910" class="arr"/><rect x="590" y="424" width="470" height="88" rx="9" class="new"/><text x="825.0" y="450.5" text-anchor="middle" class="t">Per-resource fit inputs</text><text x="825.0" y="467.5" text-anchor="middle" class="s">In: job usage B×10×3×10, machine usage and capacity B×1×3×10</text><text x="825.0" y="482.5" text-anchor="middle" class="s">Out: job usage B×10×3 (max over time ÷ 255), machine room B×1×3 (min of</text><text x="825.0" y="497.5" text-anchor="middle" class="s">capacity − usage ÷ 255)</text><path d="M825.0 126 L825.0 424" class="arr"/><path d="M590 468.0 L510 508.0" class="sarr"/><rect x="590" y="534" width="470" height="104" rx="9" class="new"/><text x="825.0" y="561.0" text-anchor="middle" class="t">Dynamic machine embedding</text><text x="825.0" y="578.0" text-anchor="middle" class="s">In: free grid B×1×3×10 (capacity − usage, ÷ 255)</text><text x="825.0" y="593.0" text-anchor="middle" class="s">Out: B×1×256</text><text x="825.0" y="608.0" text-anchor="middle" class="s">row encoder 10→64→64 for each resource, join the 3 rows (192), Linear</text><text x="825.0" y="623.0" text-anchor="middle" class="s">192→256, ReLU, Linear 256→256; the last layer starts at zero</text><rect x="590" y="660" width="470" height="104" rx="9" class="new"/><text x="825.0" y="687.0" text-anchor="middle" class="t">Pair features (machine, job)</text><text x="825.0" y="704.0" text-anchor="middle" class="s">In: free grid, job usage and size, status</text><text x="825.0" y="719.0" text-anchor="middle" class="s">Out: B×1×10×9</text><text x="825.0" y="734.0" text-anchor="middle" class="s">fits now, ticks until it fits, finish time, headroom per resource (3),</text><text x="825.0" y="749.0" text-anchor="middle" class="s">dominant share, packing score, pending flag</text><rect x="40" y="1090" width="1020" height="72" rx="9" class="base"/><text x="550.0" y="1116.0" text-anchor="middle" class="t">Feature vector</text><text x="550.0" y="1133.0" text-anchor="middle" class="s">In: global summary 256, 10 job summaries 2560, pair features 90, dynamic machine embedding 256</text><text x="550.0" y="1148.0" text-anchor="middle" class="s">Out: B×3162 (the actor reads all of it, the critic only the first 256 numbers)</text><rect x="26" y="136" width="1048" height="940" rx="14" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="300" y="156" class="s">Shared feature extractor (626,513 parameters), used by the actor and the critic</text><path d="M275.0 1030 L275.0 1090" class="arr"/><path d="M510 808.0 L534 808.0 L534 1090" class="arr"/><text x="542" y="802.0" class="s">jobs</text><path d="M590 586.0 L586 586.0 L586 1090" class="arr"/><path d="M1000 764 L1000 1090" class="arr"/><text x="40" y="1192" class="t">Actor head (140,674 parameters)</text><text x="880" y="1192" class="t" text-anchor="end">Critic (131,841 parameters)</text><rect x="40" y="1206" width="640" height="88" rx="9" class="base"/><text x="360.0" y="1232.5" text-anchor="middle" class="t">Machine embedding and pair projection</text><text x="360.0" y="1249.5" text-anchor="middle" class="s">In: dynamic machine embedding B×1×256, pair features B×1×10×9</text><text x="360.0" y="1264.5" text-anchor="middle" class="s">Out: machine B×1×256, pair B×1×10×64</text><text x="360.0" y="1279.5" text-anchor="middle" class="s">static machine embedding + the dynamic one; pair features Linear 9→64, ReLU</text><rect x="40" y="1320" width="640" height="72" rx="9" class="base"/><text x="360.0" y="1346.0" text-anchor="middle" class="t">Scoring input, one row per job</text><text x="360.0" y="1363.0" text-anchor="middle" class="s">In: global B×256, machine B×1×256, job summaries B×10×256, pair B×10×64</text><text x="360.0" y="1378.0" text-anchor="middle" class="s">Out: B×10×832 (256 + 256 + 256 + 64 for each job)</text><rect x="40" y="1418" width="310" height="88" rx="9" class="base"/><text x="195.0" y="1444.5" text-anchor="middle" class="t">Score network</text><text x="195.0" y="1461.5" text-anchor="middle" class="s">In: B×10×832</text><text x="195.0" y="1476.5" text-anchor="middle" class="s">Out: job scores B×10</text><text x="195.0" y="1491.5" text-anchor="middle" class="s">832→128→128→1, the same weights for every job</text><rect x="370" y="1418" width="310" height="88" rx="9" class="base"/><text x="525.0" y="1444.5" text-anchor="middle" class="t">Skip head</text><text x="525.0" y="1461.5" text-anchor="middle" class="s">In: global summary B×256</text><text x="525.0" y="1476.5" text-anchor="middle" class="s">Out: skip score B×1</text><text x="525.0" y="1491.5" text-anchor="middle" class="s">256→64→1</text><rect x="40" y="1532" width="640" height="72" rx="9" class="io"/><text x="360.0" y="1558.0" text-anchor="middle" class="t">Action logits</text><text x="360.0" y="1575.0" text-anchor="middle" class="s">In: skip score B×1, job scores B×10</text><text x="360.0" y="1590.0" text-anchor="middle" class="s">Out: B×11 [ skip, job 1 ... job 10 ]</text><rect x="40" y="1630" width="640" height="104" rx="9" class="io"/><text x="360.0" y="1657.0" text-anchor="middle" class="t">Policy</text><text x="360.0" y="1674.0" text-anchor="middle" class="s">In: logits B×11</text><text x="360.0" y="1689.0" text-anchor="middle" class="s">Out: one action per observation, 0 to 10</text><text x="360.0" y="1704.0" text-anchor="middle" class="s">softmax, then sample (training) or arg max (evaluation); 0 = skip, k = start job k − 1 on the</text><text x="360.0" y="1719.0" text-anchor="middle" class="s">machine</text><path d="M360.0 1162 L360.0 1206" class="arr"/><path d="M360.0 1294 L360.0 1320" class="arr"/><path d="M195 1392 L195 1418" class="arr"/><path d="M525 1392 L525 1418" class="arr"/><path d="M195 1506 L195 1532" class="arr"/><path d="M525 1506 L525 1532" class="arr"/><path d="M360.0 1604 L360.0 1630" class="arr"/><rect x="730" y="1206" width="330" height="72" rx="9" class="base"/><text x="895.0" y="1232.0" text-anchor="middle" class="t">Global summary</text><text x="895.0" y="1249.0" text-anchor="middle" class="s">In: feature vector B×3162</text><text x="895.0" y="1264.0" text-anchor="middle" class="s">Out: B×256 (its first 256 numbers)</text><rect x="730" y="1304" width="330" height="88" rx="9" class="base"/><text x="895.0" y="1330.5" text-anchor="middle" class="t">Value network</text><text x="895.0" y="1347.5" text-anchor="middle" class="s">In: B×256</text><text x="895.0" y="1362.5" text-anchor="middle" class="s">Out: B×1</text><text x="895.0" y="1377.5" text-anchor="middle" class="s">256→256→256→1</text><rect x="730" y="1418" width="330" height="72" rx="9" class="io"/><text x="895.0" y="1444.0" text-anchor="middle" class="t">State value</text><text x="895.0" y="1461.0" text-anchor="middle" class="s">In: B×1</text><text x="895.0" y="1476.0" text-anchor="middle" class="s">used by PPO to compute the advantages</text><path d="M895.0 1162 L895.0 1206" class="arr"/><path d="M895.0 1278 L895.0 1304" class="arr"/><path d="M895.0 1392 L895.0 1418" class="arr"/><text x="40" y="1762" class="s">Total 899,028 parameters. B = batch size; 10 jobs, 1 machine, 3 resources, 10 ticks.</text><text x="40" y="1780" class="s">Green = the additions over M9: per-resource fit inputs (and the fit attention that uses them), the dynamic machine embedding and the pair features.</text><text x="40" y="1798" class="s">Every job goes through the same encoder and the same scorer, so the job order does not matter.</text></svg>