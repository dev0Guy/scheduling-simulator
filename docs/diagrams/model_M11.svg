<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="900" height="860" fill="#ffffff"/><text x="40" y="30" class="h">M11: M9 + not-created mask, on E1. j5ojvpto</text><rect x="40" y="44" width="16" height="16" rx="3" class="new"/><text x="62" y="56" class="s">added in this model</text><rect x="230" y="44" width="16" height="16" rx="3" class="base"/><text x="252" y="56" class="s">carried over</text><rect x="420" y="44" width="16" height="16" rx="3" class="side"/><text x="442" y="56" class="s">side input</text><rect x="40" y="80" width="520" height="74" rx="9" class="new"/><text x="300.0" y="107.0" text-anchor="middle" class="t">Per-job input (B x 10 x 20)</text><text x="300.0" y="124.0" text-anchor="middle" class="s">status (16-d) + size, wait, ttl, arrival; all 20 values set to 0 for jobs not</text><text x="300.0" y="139.0" text-anchor="middle" class="s">yet arrived</text><rect x="600" y="80" width="290" height="74" rx="9" class="side"/><text x="745.0" y="107.0" text-anchor="middle" class="t">Not-created mask</text><text x="745.0" y="124.0" text-anchor="middle" class="s">status = NOT_CREATED (job has not arrived):</text><text x="745.0" y="139.0" text-anchor="middle" class="s">all values zeroed</text><path d="M600 117.0 L560 117.0" class="sarr"/><path d="M300.0 154 L300.0 180" class="arr"/><rect x="40" y="180" width="520" height="58" rx="9" class="base"/><text x="300.0" y="206.5" text-anchor="middle" class="t">Job encoder</text><text x="300.0" y="223.5" text-anchor="middle" class="s">20 -&gt; 256 -&gt; 256 (Linear + LayerNorm + ReLU, twice), shared across jobs</text><path d="M300.0 238 L300.0 264" class="arr"/><rect x="40" y="264" width="520" height="58" rx="9" class="base"/><text x="300.0" y="290.5" text-anchor="middle" class="t">Fit attention with feasibility mask</text><text x="300.0" y="307.5" text-anchor="middle" class="s">weight = 0 where usage &gt; room; usage of unarrived jobs set to 0</text><rect x="600" y="264" width="290" height="58" rx="9" class="side"/><text x="745.0" y="283.0" text-anchor="middle" class="t">Side input</text><text x="745.0" y="300.0" text-anchor="middle" class="s">job usage = max(usage)/255 | machine room =</text><text x="745.0" y="315.0" text-anchor="middle" class="s">min(capacity - usage)/255</text><path d="M600 293.0 L560 293.0" class="sarr"/><path d="M300.0 322 L300.0 348" class="arr"/><rect x="40" y="348" width="520" height="58" rx="9" class="base"/><text x="300.0" y="374.5" text-anchor="middle" class="t">Concat + project</text><text x="300.0" y="391.5" text-anchor="middle" class="s">[summary 256 | fit 64] -&gt; Linear -&gt; LayerNorm -&gt; ReLU -&gt; 256</text><path d="M300.0 406 L300.0 432" class="arr"/><rect x="40" y="432" width="520" height="74" rx="9" class="new"/><text x="300.0" y="459.0" text-anchor="middle" class="t">Job self-attention (4 heads)</text><text x="300.0" y="476.0" text-anchor="middle" class="s">keys masked: finished and not-yet-arrived jobs; residual + LayerNorm;</text><text x="300.0" y="491.0" text-anchor="middle" class="s">unarrived outputs set to 0</text><path d="M300.0 506 L300.0 532" class="arr"/><rect x="40" y="532" width="520" height="58" rx="9" class="new"/><text x="300.0" y="558.5" text-anchor="middle" class="t">Attention pooling</text><text x="300.0" y="575.5" text-anchor="middle" class="s">not-yet-arrived jobs get weight 0; weighted sum -&gt; global summary 256</text><path d="M300.0 590 L300.0 616" class="arr"/><rect x="40" y="616" width="520" height="74" rx="9" class="base"/><text x="300.0" y="643.0" text-anchor="middle" class="t">Scorer, once per job</text><text x="300.0" y="660.0" text-anchor="middle" class="s">[global | machine embedding | job] 768 -&gt; 128 -&gt; 128 -&gt; 1; skip head 256 -&gt; 64</text><text x="300.0" y="675.0" text-anchor="middle" class="s">-&gt; 1</text><path d="M300.0 690 L300.0 716" class="arr"/><rect x="40" y="716" width="520" height="58" rx="9" class="io"/><text x="300.0" y="742.5" text-anchor="middle" class="t">11 action logits</text><text x="300.0" y="759.5" text-anchor="middle" class="s">[skip, job 1 ... job 10] -&gt; softmax -&gt; action</text><text x="40" y="804" class="s">Critic (value) head, all models: global summary 256 -> 256 -> 256 -> 1.</text><text x="40" y="822" class="s">PPO: lr 7e-6, 2048 steps, batch 64, 5 epochs, gamma = lambda = 0.995, 2M steps.</text></svg>