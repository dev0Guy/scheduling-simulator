<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1478" width="1100" height="1478">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="1100" height="1478" fill="#ffffff"/><text x="40" y="30" class="h">The network without attention (DeepSets style): from the observation to the action and the value</text><rect x="40" y="44" width="16" height="16" rx="3" class="new"/><text x="62" y="56" class="s">added in this model</text><rect x="230" y="44" width="16" height="16" rx="3" class="base"/><text x="252" y="56" class="s">carried over</text><rect x="420" y="44" width="16" height="16" rx="3" class="side"/><text x="442" y="56" class="s">side input</text><rect x="40" y="70" width="1020" height="56" rx="9" class="io"/><text x="550.0" y="95.5" text-anchor="middle" class="t">Observation</text><text x="550.0" y="112.5" text-anchor="middle" class="s">Output: machine usage and capacity B×1×3×10; job usage B×10×3×10; status, size, ttl, arrival, wait, start and finish times B×10; time B×1</text><rect x="590" y="196" width="470" height="88" rx="9" class="new"/><text x="825.0" y="222.5" text-anchor="middle" class="t">Usage and room per resource</text><text x="825.0" y="239.5" text-anchor="middle" class="s">In: job usage B×10×3×10, machine usage and capacity B×1×3×10</text><text x="825.0" y="254.5" text-anchor="middle" class="s">Out: job usage B×10×3 (max over time ÷ 255), machine room B×1×3 (min of</text><text x="825.0" y="269.5" text-anchor="middle" class="s">capacity − usage ÷ 255)</text><rect x="590" y="306" width="470" height="120" rx="9" class="new"/><text x="825.0" y="333.5" text-anchor="middle" class="t">Pair features (machine, job)</text><text x="825.0" y="350.5" text-anchor="middle" class="s">In: free grid, job usage and size, status</text><text x="825.0" y="365.5" text-anchor="middle" class="s">Out: B×1×10×9</text><text x="825.0" y="380.5" text-anchor="middle" class="s">fits now, ticks until it fits, finish time, headroom per resource (3),</text><text x="825.0" y="395.5" text-anchor="middle" class="s">dominant share, packing score, pending flag; computed, no learned</text><text x="825.0" y="410.5" text-anchor="middle" class="s">weights</text><rect x="590" y="448" width="470" height="104" rx="9" class="new"/><text x="825.0" y="475.0" text-anchor="middle" class="t">Dynamic machine embedding</text><text x="825.0" y="492.0" text-anchor="middle" class="s">In: free grid B×1×3×10 (capacity − usage, ÷ 255)</text><text x="825.0" y="507.0" text-anchor="middle" class="s">Out: B×1×256</text><text x="825.0" y="522.0" text-anchor="middle" class="s">row encoder 10→64→64 for each resource, join the 3 rows (192), Linear</text><text x="825.0" y="537.0" text-anchor="middle" class="s">192→256, ReLU, Linear 256→256; the last layer starts at zero</text><rect x="40" y="196" width="470" height="120" rx="9" class="base"/><text x="275.0" y="223.5" text-anchor="middle" class="t">Per-job input vector</text><text x="275.0" y="240.5" text-anchor="middle" class="s">In: status B×10, size, wait, ttl, arrival B×10 each; job usage B×10×3;</text><text x="275.0" y="255.5" text-anchor="middle" class="s">machine room B×1×3 (copied to every job); pair features B×10×9</text><text x="275.0" y="270.5" text-anchor="middle" class="s">Out: B×10×35</text><text x="275.0" y="285.5" text-anchor="middle" class="s">status embedding (16 learned numbers) + 4 scaled numbers + 3 usage + 3</text><text x="275.0" y="300.5" text-anchor="middle" class="s">room + 9 pair = 35</text><rect x="40" y="342" width="470" height="104" rx="9" class="base"/><text x="275.0" y="369.0" text-anchor="middle" class="t">Job encoder</text><text x="275.0" y="386.0" text-anchor="middle" class="s">In: B×10×35</text><text x="275.0" y="401.0" text-anchor="middle" class="s">Out: B×10×256</text><text x="275.0" y="416.0" text-anchor="middle" class="s">Linear 35→256, LayerNorm, ReLU, Linear 256→256, LayerNorm, ReLU; the</text><text x="275.0" y="431.0" text-anchor="middle" class="s">same weights for every job</text><rect x="40" y="472" width="470" height="104" rx="9" class="base"/><text x="275.0" y="499.0" text-anchor="middle" class="t">Mean and max pooling over the jobs</text><text x="275.0" y="516.0" text-anchor="middle" class="s">In: B×10×256 (jobs that are not finished)</text><text x="275.0" y="531.0" text-anchor="middle" class="s">Out: B×512 (mean 256 + max 256)</text><text x="275.0" y="546.0" text-anchor="middle" class="s">no attention and no learned weights: every unfinished job counts the</text><text x="275.0" y="561.0" text-anchor="middle" class="s">same in the mean, and the max keeps the strongest signal per channel</text><rect x="40" y="602" width="470" height="88" rx="9" class="base"/><text x="275.0" y="628.5" text-anchor="middle" class="t">Global head</text><text x="275.0" y="645.5" text-anchor="middle" class="s">In: B×512</text><text x="275.0" y="660.5" text-anchor="middle" class="s">Out: global summary B×256</text><text x="275.0" y="675.5" text-anchor="middle" class="s">Linear 512→256, LayerNorm, ReLU</text><path d="M275.0 126 L275.0 196" class="arr"/><path d="M275.0 316 L275.0 342" class="arr"/><path d="M275.0 446 L275.0 472" class="arr"/><path d="M275.0 576 L275.0 602" class="arr"/><path d="M825.0 126 L825.0 196" class="arr"/><path d="M590 240.0 L510 248.0" class="sarr"/><path d="M590 366.0 L510 264.0" class="sarr"/><rect x="40" y="750" width="1020" height="72" rx="9" class="base"/><text x="550.0" y="776.0" text-anchor="middle" class="t">Feature vector</text><text x="550.0" y="793.0" text-anchor="middle" class="s">In: global summary 256, 10 job embeddings 2560, pair features 90, dynamic machine embedding 256</text><text x="550.0" y="808.0" text-anchor="middle" class="s">Out: B×3162 (the actor reads all of it, the critic only the first 256 numbers)</text><rect x="26" y="136" width="1048" height="600" rx="14" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="300" y="156" class="s">Shared feature extractor (328,016 parameters), used by the actor and the critic</text><path d="M275.0 690 L275.0 750" class="arr"/><path d="M510 394.0 L546 394.0 L546 750" class="arr"/><text x="554" y="388.0" class="s">jobs</text><path d="M590 500.0 L586 500.0 L586 750" class="arr"/><path d="M1000 552 L1000 750" class="arr"/><path d="M1060 366.0 L1068 366.0 L1068 750" class="arr"/><text x="40" y="852" class="t">Actor head (140,674 parameters)</text><text x="880" y="852" class="t" text-anchor="end">Critic (131,841 parameters)</text><rect x="40" y="866" width="640" height="88" rx="9" class="base"/><text x="360.0" y="892.5" text-anchor="middle" class="t">Machine embedding and pair projection</text><text x="360.0" y="909.5" text-anchor="middle" class="s">In: dynamic machine embedding B×1×256, pair features B×1×10×9</text><text x="360.0" y="924.5" text-anchor="middle" class="s">Out: machine B×1×256, pair B×1×10×64</text><text x="360.0" y="939.5" text-anchor="middle" class="s">static machine embedding + the dynamic one; pair features Linear 9→64, ReLU</text><rect x="40" y="980" width="640" height="72" rx="9" class="base"/><text x="360.0" y="1006.0" text-anchor="middle" class="t">Scoring input, one row per job</text><text x="360.0" y="1023.0" text-anchor="middle" class="s">In: global B×256, machine B×1×256, job embeddings B×10×256, pair B×10×64</text><text x="360.0" y="1038.0" text-anchor="middle" class="s">Out: B×10×832 (256 + 256 + 256 + 64 for each job)</text><rect x="40" y="1078" width="310" height="88" rx="9" class="base"/><text x="195.0" y="1104.5" text-anchor="middle" class="t">Score network</text><text x="195.0" y="1121.5" text-anchor="middle" class="s">In: B×10×832</text><text x="195.0" y="1136.5" text-anchor="middle" class="s">Out: job scores B×10</text><text x="195.0" y="1151.5" text-anchor="middle" class="s">832→128→128→1, the same weights for every job</text><rect x="370" y="1078" width="310" height="88" rx="9" class="base"/><text x="525.0" y="1104.5" text-anchor="middle" class="t">Skip head</text><text x="525.0" y="1121.5" text-anchor="middle" class="s">In: global summary B×256</text><text x="525.0" y="1136.5" text-anchor="middle" class="s">Out: skip score B×1</text><text x="525.0" y="1151.5" text-anchor="middle" class="s">256→64→1</text><rect x="40" y="1192" width="640" height="72" rx="9" class="io"/><text x="360.0" y="1218.0" text-anchor="middle" class="t">Action logits</text><text x="360.0" y="1235.0" text-anchor="middle" class="s">In: skip score B×1, job scores B×10</text><text x="360.0" y="1250.0" text-anchor="middle" class="s">Out: B×11 [ skip, job 1 ... job 10 ]</text><rect x="40" y="1290" width="640" height="104" rx="9" class="io"/><text x="360.0" y="1317.0" text-anchor="middle" class="t">Policy</text><text x="360.0" y="1334.0" text-anchor="middle" class="s">In: logits B×11</text><text x="360.0" y="1349.0" text-anchor="middle" class="s">Out: one action per observation, 0 to 10</text><text x="360.0" y="1364.0" text-anchor="middle" class="s">softmax, then sample (training) or arg max (evaluation); 0 = skip, k = start job k − 1 on the</text><text x="360.0" y="1379.0" text-anchor="middle" class="s">machine</text><path d="M360.0 822 L360.0 866" class="arr"/><path d="M360.0 954 L360.0 980" class="arr"/><path d="M195 1052 L195 1078" class="arr"/><path d="M525 1052 L525 1078" class="arr"/><path d="M195 1166 L195 1192" class="arr"/><path d="M525 1166 L525 1192" class="arr"/><path d="M360.0 1264 L360.0 1290" class="arr"/><rect x="730" y="866" width="330" height="72" rx="9" class="base"/><text x="895.0" y="892.0" text-anchor="middle" class="t">Global summary</text><text x="895.0" y="909.0" text-anchor="middle" class="s">In: feature vector B×3162</text><text x="895.0" y="924.0" text-anchor="middle" class="s">Out: B×256 (its first 256 numbers)</text><rect x="730" y="964" width="330" height="88" rx="9" class="base"/><text x="895.0" y="990.5" text-anchor="middle" class="t">Value network</text><text x="895.0" y="1007.5" text-anchor="middle" class="s">In: B×256</text><text x="895.0" y="1022.5" text-anchor="middle" class="s">Out: B×1</text><text x="895.0" y="1037.5" text-anchor="middle" class="s">256→256→256→1</text><rect x="730" y="1078" width="330" height="72" rx="9" class="io"/><text x="895.0" y="1104.0" text-anchor="middle" class="t">State value</text><text x="895.0" y="1121.0" text-anchor="middle" class="s">In: B×1</text><text x="895.0" y="1136.0" text-anchor="middle" class="s">used by PPO to compute the advantages</text><path d="M895.0 822 L895.0 866" class="arr"/><path d="M895.0 938 L895.0 964" class="arr"/><path d="M895.0 1052 L895.0 1078" class="arr"/><text x="40" y="1422" class="s">Total 600,531 parameters (the attention model has 899,028). B = batch size; 10 jobs, 1 machine, 3 resources, 10 ticks.</text><text x="40" y="1440" class="s">No attention anywhere: no fit attention, no job self-attention, no attention pooling. The fit information comes in as plain inputs (usage, room, pair features).</text><text x="40" y="1458" class="s">Green = inputs that the attention model handled with attention. Every job goes through the same encoder and scorer, so the job order does not matter.</text></svg>