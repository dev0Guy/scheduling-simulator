<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="900" height="520" fill="#ffffff"/><text x="40" y="30" class="h">How the models were built from each other (E4 margin vs SJF)</text><rect x="40" y="70" width="190" height="74" rx="9" class="bad"/><text x="135.0" y="104.5" text-anchor="middle" class="t">M0</text><text x="135.0" y="121.5" text-anchor="middle" class="s">cannot see usage</text><text x="135" y="136" text-anchor="middle" class="t">-164.6%</text><rect x="40" y="200" width="190" height="74" rx="9" class="base"/><text x="135.0" y="234.5" text-anchor="middle" class="t">M5</text><text x="135.0" y="251.5" text-anchor="middle" class="s">usage as raw inputs</text><text x="135" y="266" text-anchor="middle" class="t">-45.8%</text><rect x="330" y="70" width="190" height="74" rx="9" class="base"/><text x="425.0" y="104.5" text-anchor="middle" class="t">M6</text><text x="425.0" y="121.5" text-anchor="middle" class="s">fit attention (concat)</text><text x="425" y="136" text-anchor="middle" class="t">-37.0%</text><rect x="330" y="200" width="190" height="74" rx="9" class="base"/><text x="425.0" y="234.5" text-anchor="middle" class="t">M7</text><text x="425.0" y="251.5" text-anchor="middle" class="s">+ job self-attention</text><text x="425" y="266" text-anchor="middle" class="t">-16.9%</text><rect x="620" y="130" width="190" height="74" rx="9" class="bad"/><text x="715.0" y="164.5" text-anchor="middle" class="t">M8</text><text x="715.0" y="181.5" text-anchor="middle" class="s">multiply instead of concat</text><text x="715" y="196" text-anchor="middle" class="t">-25.3% (worse)</text><rect x="330" y="340" width="190" height="74" rx="9" class="new"/><text x="425.0" y="374.5" text-anchor="middle" class="t">M9</text><text x="425.0" y="391.5" text-anchor="middle" class="s">+ feasibility mask</text><text x="425" y="406" text-anchor="middle" class="t">+2.28% (beats SJF)</text><rect x="620" y="340" width="190" height="74" rx="9" class="base"/><text x="715.0" y="374.5" text-anchor="middle" class="t">M10</text><text x="715.0" y="391.5" text-anchor="middle" class="s">M9 + more entropy</text><text x="715" y="406" text-anchor="middle" class="t">+2.31% (same as M9)</text><path d="M135 144 L135 200" class="arr"/><text x="135.0" y="166.0" text-anchor="middle" class="s">add usage</text><path d="M230 107 L330 107" class="arr"/><text x="280" y="98" text-anchor="middle" class="s">usage out of</text><text x="280" y="112" text-anchor="middle" class="s">the encoder</text><path d="M425 144 L425 200" class="arr"/><text x="468" y="176" class="s">+ self-attention</text><path d="M520 237 L620 190" class="arr"/><text x="570" y="200" class="s">multiply</text><path d="M425 274 L425 340" class="arr"/><text x="468" y="312" class="s">+ mask infeasible pairs</text><path d="M520 377 L620 377" class="arr"/><text x="570.0" y="371.0" text-anchor="middle" class="s">entropy</text><text x="40" y="470" class="s">Baseline for all E4 runs: SJF rjzcixv2, mean reward -50.43. Optimal (exact search): -44.41 (+11.9%).</text><text x="40" y="490" class="s">Green = beats SJF, red = worse than the model it came from or far from SJF, blue = intermediate step.</text></svg>