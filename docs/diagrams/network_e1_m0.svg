<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1250" width="1100" height="1250">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="1100" height="1250" fill="#ffffff"/><text x="40" y="30" class="h">The network used on E1 (every job uses 255): model M0</text><rect x="40" y="70" width="1020" height="56" rx="9" class="io"/><text x="550.0" y="95.5" text-anchor="middle" class="t">Observation</text><text x="550.0" y="112.5" text-anchor="middle" class="s">Output: job status, size, ttl, arrival, wait time B×10 each; time B×1; (job usage B×10×3×10 and machine arrays B×1×3×10 are not used on E1)</text><rect x="40" y="196" width="470" height="104" rx="9" class="base"/><text x="275.0" y="223.0" text-anchor="middle" class="t">Per-job features</text><text x="275.0" y="240.0" text-anchor="middle" class="s">In: status B×10, size, wait, ttl, arrival B×10 each</text><text x="275.0" y="255.0" text-anchor="middle" class="s">Out: B×10×20</text><text x="275.0" y="270.0" text-anchor="middle" class="s">status embedding (16 learned numbers) + size, wait, ttl, arrival,</text><text x="275.0" y="285.0" text-anchor="middle" class="s">scaled by 110 (arrival = ticks until arrival)</text><rect x="40" y="326" width="470" height="88" rx="9" class="base"/><text x="275.0" y="352.5" text-anchor="middle" class="t">Job encoder</text><text x="275.0" y="369.5" text-anchor="middle" class="s">In: B×10×20</text><text x="275.0" y="384.5" text-anchor="middle" class="s">Out: B×10×256</text><text x="275.0" y="399.5" text-anchor="middle" class="s">Linear 20→256, LayerNorm, ReLU, twice; the same weights for every job</text><rect x="40" y="440" width="470" height="120" rx="9" class="base"/><text x="275.0" y="467.5" text-anchor="middle" class="t">Attention pooling</text><text x="275.0" y="484.5" text-anchor="middle" class="s">In: B×10×256</text><text x="275.0" y="499.5" text-anchor="middle" class="s">Out: global summary B×256</text><text x="275.0" y="514.5" text-anchor="middle" class="s">no query, key or value: a small network (256→32→1, tanh) scores how</text><text x="275.0" y="529.5" text-anchor="middle" class="s">much each job matters, a softmax over the jobs gives weights, the</text><text x="275.0" y="544.5" text-anchor="middle" class="s">summary is the weighted sum, then Linear 256→256, LayerNorm, ReLU</text><path d="M275.0 126 L275.0 196" class="arr"/><path d="M275.0 300 L275.0 326" class="arr"/><path d="M275.0 414 L275.0 440" class="arr"/><rect x="590" y="196" width="470" height="120" rx="9" class="io"/><text x="825.0" y="223.5" text-anchor="middle" class="t">What this model does not have</text><text x="825.0" y="240.5" text-anchor="middle" class="s">no job self-attention: jobs are never compared with each other, except</text><text x="825.0" y="255.5" text-anchor="middle" class="s">through the pooled global summary</text><text x="825.0" y="270.5" text-anchor="middle" class="s">no usage or fit inputs: on E1 every job needs the whole machine, so</text><text x="825.0" y="285.5" text-anchor="middle" class="s">only one job can run at a time and fit is never a question</text><text x="825.0" y="300.5" text-anchor="middle" class="s">no queue_pressure feature (added later in M1)</text><rect x="40" y="620" width="1020" height="72" rx="9" class="base"/><text x="550.0" y="646.0" text-anchor="middle" class="t">Feature vector</text><text x="550.0" y="663.0" text-anchor="middle" class="s">In: global summary 256, 10 job embeddings 2560 (straight from the job encoder)</text><text x="550.0" y="678.0" text-anchor="middle" class="s">Out: B×2816 (the actor reads all of it, the critic only the first 256 numbers)</text><rect x="26" y="136" width="1048" height="470" rx="14" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="7 5"/><text x="300" y="156" class="s">Shared feature extractor (146,833 parameters), used by the actor and the critic</text><path d="M275.0 560 L275.0 620" class="arr"/><path d="M510 370.0 L550 370.0 L550 620" class="arr"/><text x="558" y="364.0" class="s">job embeddings</text><text x="40" y="722" class="t">Actor head (131,842 parameters)</text><text x="880" y="722" class="t" text-anchor="end">Critic (131,841 parameters)</text><rect x="40" y="736" width="640" height="88" rx="9" class="base"/><text x="360.0" y="762.5" text-anchor="middle" class="t">Scoring input, one row per job</text><text x="360.0" y="779.5" text-anchor="middle" class="s">In: global B×256, static machine embedding B×1×256 (256 learned numbers), job embeddings</text><text x="360.0" y="794.5" text-anchor="middle" class="s">B×10×256</text><text x="360.0" y="809.5" text-anchor="middle" class="s">Out: B×10×768 (256 + 256 + 256 for each job)</text><rect x="40" y="850" width="310" height="88" rx="9" class="base"/><text x="195.0" y="876.5" text-anchor="middle" class="t">Score network</text><text x="195.0" y="893.5" text-anchor="middle" class="s">In: B×10×768</text><text x="195.0" y="908.5" text-anchor="middle" class="s">Out: job scores B×10</text><text x="195.0" y="923.5" text-anchor="middle" class="s">768→128→128→1, the same weights for every job</text><rect x="370" y="850" width="310" height="88" rx="9" class="base"/><text x="525.0" y="876.5" text-anchor="middle" class="t">Skip head</text><text x="525.0" y="893.5" text-anchor="middle" class="s">In: global summary B×256</text><text x="525.0" y="908.5" text-anchor="middle" class="s">Out: skip score B×1</text><text x="525.0" y="923.5" text-anchor="middle" class="s">256→64→1</text><rect x="40" y="964" width="640" height="72" rx="9" class="io"/><text x="360.0" y="990.0" text-anchor="middle" class="t">Action logits</text><text x="360.0" y="1007.0" text-anchor="middle" class="s">In: skip score B×1, job scores B×10</text><text x="360.0" y="1022.0" text-anchor="middle" class="s">Out: B×11 [ skip, job 1 ... job 10 ]</text><rect x="40" y="1062" width="640" height="104" rx="9" class="io"/><text x="360.0" y="1089.0" text-anchor="middle" class="t">Policy</text><text x="360.0" y="1106.0" text-anchor="middle" class="s">In: logits B×11</text><text x="360.0" y="1121.0" text-anchor="middle" class="s">Out: one action per observation, 0 to 10</text><text x="360.0" y="1136.0" text-anchor="middle" class="s">softmax, then sample (training) or arg max (evaluation); 0 = skip, k = start job k − 1 on the</text><text x="360.0" y="1151.0" text-anchor="middle" class="s">machine</text><path d="M360.0 692 L360.0 736" class="arr"/><path d="M195 824 L195 850" class="arr"/><path d="M525 824 L525 850" class="arr"/><path d="M195 938 L195 964" class="arr"/><path d="M525 938 L525 964" class="arr"/><path d="M360.0 1036 L360.0 1062" class="arr"/><rect x="730" y="736" width="330" height="72" rx="9" class="base"/><text x="895.0" y="762.0" text-anchor="middle" class="t">Global summary</text><text x="895.0" y="779.0" text-anchor="middle" class="s">In: feature vector B×2816</text><text x="895.0" y="794.0" text-anchor="middle" class="s">Out: B×256 (its first 256 numbers)</text><rect x="730" y="834" width="330" height="88" rx="9" class="base"/><text x="895.0" y="860.5" text-anchor="middle" class="t">Value network</text><text x="895.0" y="877.5" text-anchor="middle" class="s">In: B×256</text><text x="895.0" y="892.5" text-anchor="middle" class="s">Out: B×1</text><text x="895.0" y="907.5" text-anchor="middle" class="s">256→256→256→1</text><rect x="730" y="948" width="330" height="72" rx="9" class="io"/><text x="895.0" y="974.0" text-anchor="middle" class="t">State value</text><text x="895.0" y="991.0" text-anchor="middle" class="s">In: B×1</text><text x="895.0" y="1006.0" text-anchor="middle" class="s">used by PPO to compute the advantages</text><path d="M895.0 692 L895.0 736" class="arr"/><path d="M895.0 808 L895.0 834" class="arr"/><path d="M895.0 922 L895.0 948" class="arr"/><text x="40" y="1194" class="s">Total 410,516 parameters. B = batch size; 10 jobs, 1 machine. Measured from the first committed version (the np7aenua / 6b195fqa architecture).</text><text x="40" y="1212" class="s">M1 (g231w4jg, the best model on E1) adds a queue_pressure feature and masked job self-attention between the encoder and the pooling (experiment log #6 and #8).</text><text x="40" y="1230" class="s">Every job goes through the same encoder and the same scorer, so the job order does not matter.</text></svg>