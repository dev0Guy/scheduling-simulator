<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="900" height="520" fill="#ffffff"/><text x="40" y="30" class="h">Environments: what a job looks like and what fits on the machine</text><text x="40" y="52" class="s">1 machine (capacity 255), 10 jobs, 3 resources, 10-tick usage window, episode cap 110 steps. Job usage is one constant value on every resource and tick.</text><text x="40" y="92" class="h">E1: every job uses 255</text><text x="40" y="122" class="t">One job fills the machine, so jobs run strictly one after another</text><rect x="40" y="130" width="560.0" height="34" rx="6" class="io"/><rect x="40" y="130" width="560.0" height="34" rx="6" fill="#ff9d9d" stroke="#57606a"/><text x="320.0" y="152" text-anchor="middle" class="t">255</text><text x="614.0" y="152" class="t" style="fill:#1a7f37">fits</text><text x="40" y="190" class="h">E4: each job uses 63, 128 or 255 (random, 1/3 each)</text><text x="40" y="230" class="t">63 + 63 + 128 = 254</text><rect x="40" y="238" width="560.0" height="34" rx="6" class="io"/><rect x="40" y="238" width="138.3529411764706" height="34" rx="6" fill="#8fc1ff" stroke="#57606a"/><text x="109.1764705882353" y="260" text-anchor="middle" class="t">63</text><rect x="178.3529411764706" y="238" width="138.3529411764706" height="34" rx="6" fill="#8fc1ff" stroke="#57606a"/><text x="247.5294117647059" y="260" text-anchor="middle" class="t">63</text><rect x="316.7058823529412" y="238" width="281.0980392156863" height="34" rx="6" fill="#ffd27a" stroke="#57606a"/><text x="457.25490196078437" y="260" text-anchor="middle" class="t">128</text><text x="614.0" y="260" class="t" style="fill:#1a7f37">fits</text><text x="40" y="292" class="t">63 + 128 = 191</text><rect x="40" y="300" width="560.0" height="34" rx="6" class="io"/><rect x="40" y="300" width="138.3529411764706" height="34" rx="6" fill="#8fc1ff" stroke="#57606a"/><text x="109.1764705882353" y="322" text-anchor="middle" class="t">63</text><rect x="178.3529411764706" y="300" width="281.0980392156863" height="34" rx="6" fill="#ffd27a" stroke="#57606a"/><text x="318.90196078431376" y="322" text-anchor="middle" class="t">128</text><text x="614.0" y="322" class="t" style="fill:#1a7f37">fits</text><text x="40" y="354" class="t">128 + 128 = 256 &gt; 255</text><rect x="40" y="362" width="560.0" height="34" rx="6" class="io"/><rect x="40" y="362" width="281.0980392156863" height="34" rx="6" fill="#ffd27a" stroke="#57606a"/><text x="180.54901960784315" y="384" text-anchor="middle" class="t">128</text><rect x="321.0980392156863" y="362" width="281.0980392156863" height="34" rx="6" fill="#ffd27a" stroke="#57606a"/><text x="461.64705882352945" y="384" text-anchor="middle" class="t">128</text><text x="616.1960784313726" y="384" class="t" style="fill:#cf222e">does not fit</text><text x="40" y="416" class="t">63 + 255 = 318 &gt; 255 (a 255 job needs the machine to itself)</text><rect x="40" y="424" width="560.0" height="34" rx="6" class="io"/><rect x="40" y="424" width="138.3529411764706" height="34" rx="6" fill="#8fc1ff" stroke="#57606a"/><text x="109.1764705882353" y="446" text-anchor="middle" class="t">63</text><rect x="178.3529411764706" y="424" width="560.0" height="34" rx="6" fill="#ff9d9d" stroke="#57606a"/><text x="458.3529411764706" y="446" text-anchor="middle" class="t">255</text><text x="752.3529411764706" y="446" class="t" style="fill:#cf222e">does not fit</text><text x="40" y="500" class="s">The optimal schedule on E4 can run several jobs at once, so a good policy has to check what fits, not only which job is shortest.</text></svg>