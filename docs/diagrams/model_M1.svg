<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="900" height="692" fill="#ffffff"/><text x="40" y="30" class="h">M1: M0 + queue_pressure + job self-attention (g231w4jg). Best on E1.</text><rect x="40" y="44" width="16" height="16" rx="3" class="new"/><text x="62" y="56" class="s">added in this model</text><rect x="230" y="44" width="16" height="16" rx="3" class="base"/><text x="252" y="56" class="s">carried over</text><rect x="420" y="44" width="16" height="16" rx="3" class="side"/><text x="442" y="56" class="s">side input</text><rect x="40" y="80" width="520" height="58" rx="9" class="new"/><text x="300.0" y="106.5" text-anchor="middle" class="t">Per-job input</text><text x="300.0" y="123.5" text-anchor="middle" class="s">M0 features + queue_pressure (global and per job)</text><path d="M300.0 138 L300.0 164" class="arr"/><rect x="40" y="164" width="520" height="58" rx="9" class="base"/><text x="300.0" y="190.5" text-anchor="middle" class="t">Job encoder</text><text x="300.0" y="207.5" text-anchor="middle" class="s">20 -&gt; 256 -&gt; 256 (Linear + LayerNorm + ReLU, twice), shared across jobs</text><path d="M300.0 222 L300.0 248" class="arr"/><rect x="40" y="248" width="520" height="74" rx="9" class="new"/><text x="300.0" y="275.0" text-anchor="middle" class="t">Job self-attention (4 heads)</text><text x="300.0" y="292.0" text-anchor="middle" class="s">every job attends to every other job, finished jobs masked; residual +</text><text x="300.0" y="307.0" text-anchor="middle" class="s">LayerNorm</text><path d="M300.0 322 L300.0 348" class="arr"/><rect x="40" y="348" width="520" height="74" rx="9" class="base"/><text x="300.0" y="375.0" text-anchor="middle" class="t">Attention pooling</text><text x="300.0" y="392.0" text-anchor="middle" class="s">score each job (256 -&gt; 32 -&gt; 1, tanh), weighted sum, Linear -&gt; global summary</text><text x="300.0" y="407.0" text-anchor="middle" class="s">256</text><path d="M300.0 422 L300.0 448" class="arr"/><rect x="40" y="448" width="520" height="74" rx="9" class="base"/><text x="300.0" y="475.0" text-anchor="middle" class="t">Scorer, once per job</text><text x="300.0" y="492.0" text-anchor="middle" class="s">[global | machine embedding | job] 768 -&gt; 128 -&gt; 128 -&gt; 1; skip head 256 -&gt; 64</text><text x="300.0" y="507.0" text-anchor="middle" class="s">-&gt; 1</text><path d="M300.0 522 L300.0 548" class="arr"/><rect x="40" y="548" width="520" height="58" rx="9" class="io"/><text x="300.0" y="574.5" text-anchor="middle" class="t">11 action logits</text><text x="300.0" y="591.5" text-anchor="middle" class="s">[skip, job 1 ... job 10] -&gt; softmax -&gt; action</text><text x="40" y="636" class="s">Critic (value) head, all models: global summary 256 -> 256 -> 256 -> 1.</text><text x="40" y="654" class="s">PPO: lr 7e-6, 2048 steps, batch 64, 5 epochs, gamma = lambda = 0.995, 2M steps.</text></svg>