<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 952" width="1060" height="952">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .t { font-size: 13px; font-weight: 600; }
  .s { font-size: 11.5px; fill: #57606a; }
  .h { font-size: 17px; font-weight: 700; }
  .base { fill: #eaf1fb; stroke: #5b8fd6; stroke-width: 1.4; }
  .new  { fill: #e3f6e8; stroke: #2da44e; stroke-width: 2.2; }
  .side { fill: #fff6e0; stroke: #d4a72c; stroke-width: 1.4; }
  .io   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
  .bad  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
  .arr  { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .sarr { stroke: #d4a72c; stroke-width: 1.6; fill: none; marker-end: url(#a2); stroke-dasharray: 5 4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a72c"/></marker>
</defs>
<rect width="1060" height="952" fill="#ffffff"/><text x="40" y="30" class="h">pfrw14vh: M9 plus three additions and a new training setup</text><rect x="40" y="44" width="16" height="16" rx="3" class="new"/><text x="62" y="56" class="s">added in this model</text><rect x="230" y="44" width="16" height="16" rx="3" class="base"/><text x="252" y="56" class="s">carried over</text><rect x="420" y="44" width="16" height="16" rx="3" class="side"/><text x="442" y="56" class="s">side input</text><rect x="40" y="90" width="500" height="58" rx="9" class="base"/><text x="290.0" y="116.5" text-anchor="middle" class="t">Per-job input (B x 10 x 20)</text><text x="290.0" y="133.5" text-anchor="middle" class="s">status (16-d) + size, wait, ttl, arrival (no usage)</text><path d="M290.0 148 L290.0 172" class="arr"/><rect x="40" y="172" width="500" height="58" rx="9" class="base"/><text x="290.0" y="198.5" text-anchor="middle" class="t">Job encoder</text><text x="290.0" y="215.5" text-anchor="middle" class="s">20 -&gt; 256 -&gt; 256 (Linear + LayerNorm + ReLU, twice), shared across jobs</text><path d="M290.0 230 L290.0 254" class="arr"/><rect x="40" y="254" width="500" height="90" rx="9" class="new"/><text x="290.0" y="289.0" text-anchor="middle" class="t">Fit attention + feasibility mask, per resource</text><text x="290.0" y="306.0" text-anchor="middle" class="s">Q from job usage (3 numbers), K and V from machine room (3 numbers); weight</text><text x="290.0" y="321.0" text-anchor="middle" class="s">= 0 unless the job fits on EVERY resource</text><path d="M290.0 344 L290.0 368" class="arr"/><rect x="40" y="368" width="500" height="58" rx="9" class="base"/><text x="290.0" y="394.5" text-anchor="middle" class="t">Concat + project</text><text x="290.0" y="411.5" text-anchor="middle" class="s">[summary 256 | fit 64] -&gt; Linear -&gt; LayerNorm -&gt; ReLU -&gt; 256</text><path d="M290.0 426 L290.0 450" class="arr"/><rect x="40" y="450" width="500" height="58" rx="9" class="base"/><text x="290.0" y="469.0" text-anchor="middle" class="t">Job self-attention (4 heads)</text><text x="290.0" y="486.0" text-anchor="middle" class="s">every job attends to every other job, finished jobs masked; residual +</text><text x="290.0" y="501.0" text-anchor="middle" class="s">LayerNorm</text><path d="M290.0 508 L290.0 532" class="arr"/><rect x="40" y="532" width="500" height="58" rx="9" class="base"/><text x="290.0" y="558.5" text-anchor="middle" class="t">Attention pooling</text><text x="290.0" y="575.5" text-anchor="middle" class="s">score each job (256 -&gt; 32 -&gt; 1, tanh), weighted sum -&gt; global summary 256</text><path d="M290.0 590 L290.0 614" class="arr"/><rect x="40" y="614" width="500" height="74" rx="9" class="new"/><text x="290.0" y="641.0" text-anchor="middle" class="t">Scorer, once per job</text><text x="290.0" y="658.0" text-anchor="middle" class="s">[global 256 | machine 256 | job 256 | pair 64] = 832 -&gt; 128 -&gt; 128 -&gt; 1;</text><text x="290.0" y="673.0" text-anchor="middle" class="s">skip head 256 -&gt; 64 -&gt; 1</text><path d="M290.0 688 L290.0 712" class="arr"/><rect x="40" y="712" width="500" height="58" rx="9" class="io"/><text x="290.0" y="738.5" text-anchor="middle" class="t">11 action logits</text><text x="290.0" y="755.5" text-anchor="middle" class="s">[skip, job 1 ... job 10] -&gt; softmax -&gt; action</text><rect x="590" y="254" width="430" height="90" rx="9" class="new"/><text x="805.0" y="281.5" text-anchor="middle" class="t">1. Per-resource fit inputs</text><text x="805.0" y="298.5" text-anchor="middle" class="s">Old: one number per job (max usage) and one per machine</text><text x="805.0" y="313.5" text-anchor="middle" class="s">(min room). New: one number per resource, 3 each, each</text><text x="805.0" y="328.5" text-anchor="middle" class="s">taken over time only.</text><path d="M590 299.0 L540 299.0" class="sarr"/><rect x="590" y="498" width="430" height="112" rx="9" class="new"/><text x="805.0" y="521.5" text-anchor="middle" class="t">2. Dynamic machine embedding</text><text x="805.0" y="538.5" text-anchor="middle" class="s">Free-capacity grid (3 resources x 10 ticks) / 255 -&gt;</text><text x="805.0" y="553.5" text-anchor="middle" class="s">shared row encoder 10 -&gt; 64 -&gt; 64 -&gt; join the 3 rows</text><text x="805.0" y="568.5" text-anchor="middle" class="s">(192) -&gt; 256 -&gt; 256. Added to the static machine</text><text x="805.0" y="583.5" text-anchor="middle" class="s">embedding. Last layer starts at zero, so training starts</text><text x="805.0" y="598.5" text-anchor="middle" class="s">like M9.</text><rect x="590" y="636" width="430" height="128" rx="9" class="new"/><text x="805.0" y="675.0" text-anchor="middle" class="t">3. Pair features (machine, job): 9 numbers</text><text x="805.0" y="692.0" text-anchor="middle" class="s">pending, fits now, delay until it fits / 10, finish</text><text x="805.0" y="707.0" text-anchor="middle" class="s">time, headroom per resource (3), dominant share,</text><text x="805.0" y="722.0" text-anchor="middle" class="s">packing. Delay checks every start offset 0 to 9 against</text><text x="805.0" y="737.0" text-anchor="middle" class="s">the free grid. Linear 9 -&gt; 64.</text><path d="M590 666 L568 666 L568 651.0 L540 651.0" class="sarr"/><path d="M590 586 L554 586 L554 643.0 L540 643.0" class="sarr"/><rect x="40" y="806" width="980" height="96" rx="9" class="new"/><text x="530.0" y="836.5" text-anchor="middle" class="t">Training changes (not part of the network)</text><text x="530.0" y="853.5" text-anchor="middle" class="s">8 envs x 512 steps per update (earlier runs: 4 x 2048). Learning rate 2e-5 (from example.py) decaying linearly to 5% (M9: constant 7e-6). target_kl</text><text x="530.0" y="868.5" text-anchor="middle" class="s">0.03 stops an epoch early when the policy moves too far. Entropy 0.05 -&gt; 0.01 (M9: 0.02 -&gt; 0.002). Evaluation uses 50-episode checks and the final</text><text x="530.0" y="883.5" text-anchor="middle" class="s">test loads the best saved checkpoint, not the last model.</text><text x="40" y="918" class="s">Critic (value) head: global summary 256 -> 256 -> 256 -> 1.   PPO: batch 64, 5 epochs, gamma = lambda = 0.995, 2M steps.</text><text x="40" y="936" class="s">Everything else is unchanged from M9. Run pfrw14vh (olive-fire-343).</text></svg>